# Harbor Dock Station — DEVELOPMENT stack
# Usage:
#   docker compose -f docker-compose.dev.yml up --build
#
# Builds from Dockerfile.dev for backend + frontend.
# Bind-mounts source so edits apply at runtime.

services:
  mysql:
    image: mysql:8.0
    container_name: harbordock-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: harbordock
      MYSQL_USER: harbordock
      MYSQL_PASSWORD: harbordock
    ports:
      - "3306:3306"
    volumes:
      - harbordock_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uharbordock", "-pharbordock"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: harbordock-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_ENV: development
      DATABASE_URL: mysql+pymysql://harbordock:harbordock@mysql:3306/harbordock
      FRONTEND_URL: http://localhost:3000
      CORS_ORIGINS: http://localhost:3000
      WATCHFILES_FORCE_POLLING: "true"
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    container_name: harbordock-frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next_cache:/app/.next
    depends_on:
      - backend

volumes:
  harbordock_mysql_data:
  frontend_node_modules:
  frontend_next_cache:
